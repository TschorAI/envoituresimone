# The drive of my own projects: copied into a project that names no other (project-sync, install.sh).
SYNC_DEST="proton:TschorAI/Projects"
SYNC_NAME="Proton Drive"
SYNC_TITLE="TschorAI projects"
# Proton Drive rate-limits hard: the default 4 parallel transfers provokes 429s.
SYNC_FLAGS="--transfers 2 --checkers 2 --retries 3"
